<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#171717" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-visual" />
    <link rel="preload" href="/fonts/Dana/DanaVF.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Darvish/Darvish VF.woff2" as="font" type="font/woff2" crossorigin />
    <title>SpaceZen — ذهن دوم</title>

    <!-- Synchronous Theme Initializer (Prevents any Dark/Light mode flash/FOUC on startup) -->
    <script>
      (function() {
        try {
          var STORAGE_KEY = 'second_brain_theme';
          var MIGRATION_KEY = 'second_brain_theme_migrated_to_claude';
          var LEGACY_KEY = 'second_brain_theme_legacy';
          var saved = localStorage.getItem(STORAGE_KEY);
          var legacyDarkThemes = [
            'default-dark', 'github-dark', 'miku-dark', 'caffeine-dark',
            'rose-pine-dark', 'dracula-dark', 'one-dark', 'nord-dark', 'tokyo-night'
          ];
          var darkThemes = ['claude-dark'].concat(legacyDarkThemes);
          var themeCardColors = {
            'claude-dark': '#171717',
            'claude-light': '#ffffff',
            'default-light': '#ffffff',
            'sky-light': '#ffffff',
            'github-light': '#ffffff',
            'retro-keyboard': '#fffdfa',
            'solarized-light': '#fdf6e3',
            'one-light': '#ffffff',
            'nord-light': '#eceff4',
            'rose-pine-dawn': '#fffaf3',
            'default-dark': '#18181b',
            'github-dark': '#161b22',
            'miku-dark': '#1b2230',
            'caffeine-dark': '#241e1a',
            'rose-pine-dark': '#1f1d2e',
            'dracula-dark': '#282a36',
            'one-dark': '#21252b',
            'nord-dark': '#2e3440',
            'tokyo-night': '#1f2335'
          };
          var themeBgColors = {
            'claude-dark': '#0a0a0a',
            'claude-light': '#faf9f5',
            'default-light': '#fafafa',
            'sky-light': '#f0f7ff',
            'github-light': '#f6f8fa',
            'retro-keyboard': '#f4eee0',
            'solarized-light': '#eee8d5',
            'one-light': '#fafafa',
            'nord-light': '#e5e9f0',
            'rose-pine-dawn': '#faf4ed',
            'default-dark': '#09090b',
            'github-dark': '#0d1117',
            'miku-dark': '#12161f',
            'caffeine-dark': '#181412',
            'rose-pine-dark': '#191724',
            'dracula-dark': '#1e1f29',
            'one-dark': '#1a1d23',
            'nord-dark': '#242933',
            'tokyo-night': '#1a1b26'
          };

          var isClaude = saved === 'claude-dark' || saved === 'claude-light';
          var migrated = localStorage.getItem(MIGRATION_KEY) === 'true';

          if (!isClaude) {
            if (saved && !migrated) {
              var wasDark = legacyDarkThemes.indexOf(saved) !== -1;
              var next = wasDark ? 'claude-dark' : 'claude-light';
              localStorage.setItem(LEGACY_KEY, saved);
              localStorage.setItem(MIGRATION_KEY, 'true');
              localStorage.setItem(STORAGE_KEY, next);
              saved = next;
              isClaude = true;
            } else if (!saved) {
              saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'claude-dark'
                : 'claude-light';
              localStorage.setItem(STORAGE_KEY, saved);
              localStorage.setItem(MIGRATION_KEY, 'true');
              isClaude = true;
            }
          }

          // A legacy theme explicitly selected after migration is allowed
          // until the old palette is removed at the end of the redesign.
          var isDark = darkThemes.indexOf(saved) !== -1;
          var card = themeCardColors[saved] || (isDark ? '#171716' : '#ffffff');
          var bg = themeBgColors[saved] || (isDark ? '#0b0b0a' : '#faf9f5');

          document.documentElement.setAttribute('data-theme', saved);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          document.documentElement.style.backgroundColor = bg;

          var meta = document.querySelector('meta[name="theme-color"]');
          if (!meta) {
            meta = document.createElement('meta');
            meta.name = 'theme-color';
            document.head.appendChild(meta);
          }
          meta.content = card;
        } catch(e) {}
      })();

      (function() {
        function renderBootError(title, detail) {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          var isDesktop = Boolean(window.desktop);
          var safeTitle = String(title || 'خطا در راه‌اندازی برنامه').replace(/[<>&]/g, '');
          var safeDetail = String(detail || '').replace(/[<>&]/g, '');
          root.innerHTML =
            '<div dir="rtl" style="min-height:100vh;display:flex;flex-direction:column;background:#171717;color:#f5f5f5;font-family:Tahoma,system-ui,sans-serif;">' +
              (isDesktop
                ? '<div style="height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#121212;border-bottom:1px solid #262626;-webkit-app-region:drag;user-select:none;">' +
                    '<span style="font-size:12px;color:#a3a3a3;">SpaceZen — گزارش خطا</span>' +
                    '<div dir="ltr" style="display:flex;gap:6px;-webkit-app-region:no-drag;">' +
                      '<button onclick="window.desktop&&window.desktop.minimize()" style="background:transparent;border:1px solid #303030;color:#d4d4d4;border-radius:6px;padding:3px 9px;cursor:pointer;">—</button>' +
                      '<button onclick="window.desktop&&window.desktop.toggleMaximize()" style="background:transparent;border:1px solid #303030;color:#d4d4d4;border-radius:6px;padding:3px 9px;cursor:pointer;">□</button>' +
                      '<button onclick="window.desktop&&window.desktop.close()" style="background:#e11d48;border:1px solid #e11d48;color:#fff;border-radius:6px;padding:3px 9px;cursor:pointer;">✕</button>' +
                    '</div>' +
                  '</div>'
                : '') +
              '<div style="flex:1;display:flex;align-items:center;justify-content:center;padding:24px;">' +
                '<div style="width:100%;max-width:560px;background:#1f1f1f;border:1px solid #2e2e2e;border-radius:12px;padding:24px;">' +
                  '<h1 style="margin:0 0 8px;font-size:16px;color:#fda4af;">' + safeTitle + '</h1>' +
                  '<p style="margin:0 0 14px;font-size:12.5px;color:#a3a3a3;line-height:1.7;">یک خطای زمان راه‌اندازی مانع نمایش رابط کاربری شد. جزئیات خطا در زیر قابل مشاهده است.</p>' +
                  '<pre dir="ltr" style="margin:0 0 16px;padding:12px;background:#141414;border:1px solid #262626;border-radius:8px;color:#e5e5e5;font-size:11.5px;text-align:left;overflow:auto;max-height:240px;white-space:pre-wrap;word-break:break-word;">' + safeDetail + '</pre>' +
                  '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
                    '<button onclick="window.desktop&&window.desktop.reload?window.desktop.reload():location.reload()" style="background:#f5f5f5;color:#171717;border:1px solid #f5f5f5;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;">بارگذاری مجدد</button>' +
                    (isDesktop
                      ? '<button onclick="window.desktop&&window.desktop.toggleDevTools&&window.desktop.toggleDevTools()" style="background:#262626;color:#f5f5f5;border:1px solid #383838;border-radius:8px;padding:8px 14px;font-size:12px;cursor:pointer;">ابزار توسعه‌دهنده (F12)</button>'
                      : '') +
                  '</div>' +
                '</div>' +
              '</div>' +
            '</div>';
        }
        window.addEventListener('error', function(e) {
          var msg = (e && e.error && (e.error.stack || e.error.message)) || (e && e.message) || 'Unknown error';
          renderBootError('خطا در بارگذاری ماژول‌های برنامه', msg);
        });
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && e.reason;
          var msg = (reason && (reason.stack || reason.message)) || String(reason || 'Unhandled promise rejection');
          renderBootError('خطای ناهمگام در راه‌اندازی برنامه', msg);
        });
      })();
    </script>

    <style>
      /* Critical first-paint styles. The app is offline-first: the shell paints
         straight into the real UI, so there is no boot/splash/loading state. */
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        background: transparent;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        background: transparent;
      }
    </style>
  </head>
  <body class="font-sans antialiased selection:bg-black selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
