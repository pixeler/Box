<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#171717" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-visual" />
    <link rel="preload" href="/fonts/Dana/DanaVF.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Darvish/Darvish VF.woff2" as="font" type="font/woff2" crossorigin />
    <title>Box :: جعبه</title>

    <!-- Synchronous Theme Initializer (Prevents any Dark/Light mode flash/FOUC on startup) -->
    <script>
      (function() {
        try {
          var STORAGE_KEY = 'second_brain_theme';
          var MIGRATION_KEY = 'second_brain_theme_migrated_to_claude';
          var LEGACY_KEY = 'second_brain_theme_legacy';
          var saved = localStorage.getItem(STORAGE_KEY);
          var legacyDarkThemes = [
            'default-dark', 'github-dark', 'miku-dark', 'caffeine-dark',
            'rose-pine-dark', 'dracula-dark', 'one-dark', 'nord-dark', 'tokyo-night'
          ];
          var darkThemes = ['claude-dark'].concat(legacyDarkThemes);
          var themeCardColors = {
            'claude-dark': '#171717',
            'claude-light': '#ffffff',
            'default-light': '#ffffff',
            'sky-light': '#ffffff',
            'github-light': '#ffffff',
            'retro-keyboard': '#fffdfa',
            'solarized-light': '#fdf6e3',
            'one-light': '#ffffff',
            'nord-light': '#eceff4',
            'rose-pine-dawn': '#fffaf3',
            'default-dark': '#18181b',
            'github-dark': '#161b22',
            'miku-dark': '#1b2230',
            'caffeine-dark': '#241e1a',
            'rose-pine-dark': '#1f1d2e',
            'dracula-dark': '#282a36',
            'one-dark': '#21252b',
            'nord-dark': '#2e3440',
            'tokyo-night': '#1f2335'
          };
          var themeBgColors = {
            'claude-dark': '#0a0a0a',
            'claude-light': '#faf9f5',
            'default-light': '#fafafa',
            'sky-light': '#f0f7ff',
            'github-light': '#f6f8fa',
            'retro-keyboard': '#f4eee0',
            'solarized-light': '#eee8d5',
            'one-light': '#fafafa',
            'nord-light': '#e5e9f0',
            'rose-pine-dawn': '#faf4ed',
            'default-dark': '#09090b',
            'github-dark': '#0d1117',
            'miku-dark': '#12161f',
            'caffeine-dark': '#181412',
            'rose-pine-dark': '#191724',
            'dracula-dark': '#1e1f29',
            'one-dark': '#1a1d23',
            'nord-dark': '#242933',
            'tokyo-night': '#1a1b26'
          };

          var isClaude = saved === 'claude-dark' || saved === 'claude-light';
          var migrated = localStorage.getItem(MIGRATION_KEY) === 'true';

          if (!isClaude) {
            if (saved && !migrated) {
              var wasDark = legacyDarkThemes.indexOf(saved) !== -1;
              var next = wasDark ? 'claude-dark' : 'claude-light';
              localStorage.setItem(LEGACY_KEY, saved);
              localStorage.setItem(MIGRATION_KEY, 'true');
              localStorage.setItem(STORAGE_KEY, next);
              saved = next;
              isClaude = true;
            } else if (!saved) {
              saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'claude-dark'
                : 'claude-light';
              localStorage.setItem(STORAGE_KEY, saved);
              localStorage.setItem(MIGRATION_KEY, 'true');
              isClaude = true;
            }
          }

          // A legacy theme explicitly selected after migration is allowed
          // until the old palette is removed at the end of the redesign.
          var isDark = darkThemes.indexOf(saved) !== -1;
          var card = themeCardColors[saved] || (isDark ? '#171716' : '#ffffff');
          var bg = themeBgColors[saved] || (isDark ? '#0b0b0a' : '#faf9f5');

          document.documentElement.setAttribute('data-theme', saved);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          document.documentElement.style.backgroundColor = bg;

          var meta = document.querySelector('meta[name="theme-color"]');
          if (!meta) {
            meta = document.createElement('meta');
            meta.name = 'theme-color';
            document.head.appendChild(meta);
          }
          meta.content = card;
        } catch(e) {}
      })();
    </script>

    <style>
      /* Critical first-paint styles. The app is offline-first: the shell paints
         straight into the real UI, so there is no boot/splash/loading state. */
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        background: transparent;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        background: transparent;
      }
    </style>
  </head>
  <body class="font-sans antialiased selection:bg-black selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
