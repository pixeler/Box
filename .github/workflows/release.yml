name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            args: --win portable
          - platform: linux
            os: ubuntu-latest
            args: --linux deb AppImage
          - platform: macos
            os: macos-latest
            args: --mac
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web bundle
        run: pnpm build

      - name: Package desktop app
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # Unsigned builds: do not look for a signing identity on the runner.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.deb
            release/*.AppImage
          if-no-files-found: error

  android:
    name: Android (apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The build pins buildToolsVersion 36.0.0; a runner image that predates it
      # can still fetch it, as long as the SDK licences are accepted first.
      - name: Accept Android SDK licences
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin 2>/dev/null | tail -n 1)/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "build-tools;36.0.0" "platforms;android-36" > /dev/null 2>&1 || true
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web bundle and sync Capacitor
        run: pnpm run android:sync

      - name: Point Gradle at the runner SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Assemble release APK
        run: |
          cd android
          chmod +x gradlew
          sh ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/release/app-release.apk "apk/Box-${{ github.ref_name }}-arm64.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apk/*.apk
          if-no-files-found: error

  publish:
    name: Attach artifacts to the release
    needs: [desktop, android]
    # One platform failing should not throw away the builds that did succeed, so
    # the release is published with whatever artifacts exist.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.deb
            artifacts/*.AppImage
            artifacts/*.apk
