name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the artifacts to (defaults to the pushed ref)
        required: false

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            args: --win portable
          - platform: linux
            os: ubuntu-latest
            args: --linux deb AppImage
          - platform: macos
            os: macos-latest
            args: --mac
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web bundle
        run: pnpm build

      - name: Package desktop app
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # Unsigned builds: do not look for a signing identity on the runner.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.deb
            release/*.AppImage
          if-no-files-found: error

  android:
    name: Android (apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The build pins buildToolsVersion 36.0.0; a runner image that predates it
      # can still fetch it, as long as the SDK licences are accepted first.
      - name: Accept Android SDK licences
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin 2>/dev/null | tail -n 1)/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "build-tools;36.0.0" "platforms;android-36" > /dev/null 2>&1 || true
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web bundle and sync Capacitor
        run: pnpm run android:sync

      - name: Point Gradle at the runner SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      # This runner image refuses services.gradle.org, which is where the
      # wrapper fetches its distribution, so use the GitHub mirror of the very
      # same zip instead of a different Gradle version.
      - name: Point the Gradle wrapper at the GitHub mirror
        run: |
          PROPERTIES=android/gradle/wrapper/gradle-wrapper.properties
          VERSION=$(sed -n 's/.*gradle-\(.*\)-all\.zip.*/\1/p' "$PROPERTIES" | head -n 1)
          MIRROR="https\://github.com/gradle/gradle-distributions/releases/download/v${VERSION}/gradle-${VERSION}-all.zip"
          echo "Using $MIRROR"
          sed -i "s|^distributionUrl=.*|distributionUrl=$MIRROR|" "$PROPERTIES"
          grep distributionUrl "$PROPERTIES"

      - name: Assemble release APK
        run: |
          cd android
          chmod +x gradlew
          # Node-based actions reach the network through the runner proxy, but a
          # plain JVM connects directly and gets refused. Give Gradle the same
          # proxy, and retry since the wrapper downloads Gradle on first use.
          PROXY_ARGS=""
          if [ -n "$HTTPS_PROXY" ]; then
            HOSTPORT=${HTTPS_PROXY#*://}
            PROXY_HOST=${HOSTPORT%%:*}
            PROXY_PORT=${HOSTPORT#*:}
            PROXY_PORT=${PROXY_PORT%%/*}
            PROXY_ARGS="-Dhttps.proxyHost=$PROXY_HOST -Dhttps.proxyPort=$PROXY_PORT -Dhttp.proxyHost=$PROXY_HOST -Dhttp.proxyPort=$PROXY_PORT"
            echo "Gradle will use the runner proxy $PROXY_HOST:$PROXY_PORT"
          fi
          for attempt in 1 2 3; do
            if JAVA_OPTS="$JAVA_OPTS $PROXY_ARGS" sh ./gradlew assembleRelease --no-daemon --stacktrace; then
              exit 0
            fi
            echo "Gradle attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          exit 1

      - name: Collect APK
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/release/app-release.apk "apk/Box-${{ github.ref_name }}-arm64.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apk/*.apk
          if-no-files-found: error

  publish:
    name: Attach artifacts to the release
    needs: [desktop, android]
    # One platform failing should not throw away the builds that did succeed, so
    # the release is published with whatever artifacts exist.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.deb
            artifacts/*.AppImage
            artifacts/*.apk
